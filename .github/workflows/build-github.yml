name: Build, Test, Pack, and Publish

on:
  workflow_call:
    inputs:
      ref:
        description: Commit to build after the version bump
        required: true
        type: string
      publish:
        description: Publish packages after a merged PR version bump
        default: false
        type: boolean
      prerelease:
        description: Append the -pre suffix to the package version
        default: false
        type: boolean
    secrets:
      NUGET_AUTH_TOKEN:
        description: NuGet.org API key with Push permission for Lite.EventIpc
        required: false
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]

permissions:
  contents: read

env:
  PATH_SLNX: src/Lite.EventIpc.slnx
  PATH_LIB: src/Lite.EventIpc/Lite.EventIpc.csproj
  PATH_ARTIFACTS: ${{ github.workspace }}/artifacts

jobs:
  build-test-pack:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Determine version
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_BRANCH: ${{ github.base_ref }}
          REF_NAME: ${{ github.ref_name }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          $ErrorActionPreference = 'Stop'
          $baseVersion = dotnet msbuild $env:PATH_LIB -getProperty:Version -nologo
          if ($LASTEXITCODE -ne 0) { throw 'Failed to read the project version.' }
          $baseVersion = "$baseVersion".Trim()
          if ($baseVersion -notmatch '^\d+\.\d+\.\d+\.\d+$') {
            throw "Expected a major.minor.patch.build project version; got '$baseVersion'."
          }

          $version = $baseVersion
          if ($env:PRERELEASE -eq 'true' -or
              ($env:EVENT_NAME -eq 'push' -and $env:REF_NAME -eq 'develop') -or
              ($env:EVENT_NAME -eq 'pull_request' -and $env:BASE_BRANCH -eq 'develop')) {
            $version = "$baseVersion-pre"
          }

          "PACKAGE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Building v$version"

      - name: Restore dependencies
        run: dotnet restore $env:PATH_SLNX

      - name: Build
        run: dotnet build $env:PATH_SLNX --configuration Release --no-restore -p:Version=$env:PACKAGE_VERSION -p:PackageVersion=$env:PACKAGE_VERSION

      - name: Test
        run: dotnet test $env:PATH_SLNX --configuration Release --no-build --verbosity normal

      - name: Pack NuGet
        run: dotnet pack $env:PATH_LIB --configuration Release --no-build --output $env:PATH_ARTIFACTS -p:Version=$env:PACKAGE_VERSION -p:PackageVersion=$env:PACKAGE_VERSION

      - name: Upload packages
        uses: actions/upload-artifact@v6
        with:
          name: packages-${{ env.PACKAGE_VERSION }}
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error

      - name: Publish to NuGet.org
        if: >-
          inputs.publish == true &&
          github.event_name == 'pull_request_target' &&
          github.event.action == 'closed' &&
          github.event.pull_request.merged == true &&
          (github.base_ref == 'develop' || github.base_ref == 'master')
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.NUGET_AUTH_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          if ([string]::IsNullOrWhiteSpace($env:NUGET_AUTH_TOKEN)) {
            throw 'NUGET_AUTH_TOKEN is missing. Update the repository Actions secret and pass it to the reusable workflow.'
          }
          # Resolve files in PowerShell: NuGet's wildcard matching fails on
          # Windows paths mixing backslashes with the workflow's forward slashes.
          $packages = @(Get-ChildItem -LiteralPath $env:PATH_ARTIFACTS -Filter '*.nupkg' -File)
          if ($packages.Count -eq 0) {
            throw "No NuGet packages were found in $env:PATH_ARTIFACTS. Check the Pack NuGet step."
          }
          foreach ($package in $packages) {
            Write-Host "Publishing $($package.Name) to NuGet.org"
            $pushOutput = dotnet nuget push $package.FullName --api-key $env:NUGET_AUTH_TOKEN --source https://api.nuget.org/v3/index.json --skip-duplicate --force-english-output 2>&1
            $pushExitCode = $LASTEXITCODE
            $message = ($pushOutput | Out-String).Replace($env:NUGET_AUTH_TOKEN, '***')
            Write-Host $message
            if ($pushExitCode -ne 0) {
              if ($message -match '\b(401|403)\b|Unauthorized|Forbidden') {
                throw "NuGet.org rejected the credentials for $($package.Name). Replace NUGET_AUTH_TOKEN with an unexpired NuGet.org API key scoped to Push for Lite.EventIpc, owned by an account allowed to publish that package."
              }
              throw "NuGet publish failed for $($package.Name) with exit code $pushExitCode. See the NuGet output above for the server error."
            }
          }
