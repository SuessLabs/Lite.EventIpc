name: Build, Test, Pack, and Publish

on:
  workflow_call:
    inputs:
      ref:
        description: Commit to build after the develop version bump
        required: true
        type: string
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]

permissions:
  contents: read

env:
  PATH_SLNX: src/Lite.EventIpc.slnx
  PATH_LIB: src/Lite.EventIpc/Lite.EventIpc.csproj
  PATH_ARTIFACTS: ${{ github.workspace }}/artifacts

jobs:
  build-test-pack:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Determine version
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          BASE_BRANCH: ${{ github.base_ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $baseVersion = dotnet msbuild $env:PATH_LIB -getProperty:Version -nologo
          if ($LASTEXITCODE -ne 0) { throw 'Failed to read the project version.' }
          $baseVersion = "$baseVersion".Trim()
          if ($baseVersion -notmatch '^\d+\.\d+\.\d+$') {
            throw "Expected a major.minor.patch project version; got '$baseVersion'."
          }

          if ($env:EVENT_NAME -eq 'push' -and $env:REF_NAME -eq 'master') {
            $version = $baseVersion
          }
          elseif (($env:EVENT_NAME -eq 'push' -and $env:REF_NAME -eq 'develop') -or
                  ($env:EVENT_NAME -eq 'pull_request_target' -and
                   $env:EVENT_ACTION -eq 'closed' -and $env:BASE_BRANCH -eq 'develop')) {
            $version = "$baseVersion-beta.$env:GITHUB_RUN_NUMBER"
          }
          else {
            $version = "$baseVersion-alpha.$env:GITHUB_RUN_NUMBER"
          }

          "PACKAGE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Building version $version"

      - name: Restore dependencies
        run: dotnet restore $env:PATH_SLNX

      - name: Build
        run: dotnet build $env:PATH_SLNX --configuration Release --no-restore -p:Version=$env:PACKAGE_VERSION -p:PackageVersion=$env:PACKAGE_VERSION

      - name: Test
        run: dotnet test $env:PATH_SLNX --configuration Release --no-build --verbosity normal

      - name: Pack NuGet
        run: dotnet pack $env:PATH_LIB --configuration Release --no-build --output $env:PATH_ARTIFACTS -p:Version=$env:PACKAGE_VERSION -p:PackageVersion=$env:PACKAGE_VERSION

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ env.PACKAGE_VERSION }}
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error

      - name: Publish to NuGet.org
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.NUGET_AUTH_TOKEN }}
        run: dotnet nuget push "$env:PATH_ARTIFACTS/*.nupkg" --api-key $env:NUGET_AUTH_TOKEN --source https://api.nuget.org/v3/index.json
