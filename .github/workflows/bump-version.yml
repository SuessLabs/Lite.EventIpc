name: Version and publish merged PR

on:
  # The base-branch workflow handles merged PRs, including PRs from forks.
  pull_request_target:
    branches: [ develop, master ]
    types: [ closed ]

permissions:
  contents: read

jobs:
  bump-version:
    if: github.event.pull_request.merged == true
    runs-on: windows-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.bump.outputs.sha }}
    steps:
      # Only check out the trusted base branch after merge, never the PR head.
      - name: Checkout merged branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 0

      - name: Increment and commit version
        id: bump
        shell: pwsh
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TARGET_BRANCH: ${{ github.event.pull_request.base.ref }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          if ($env:TARGET_BRANCH -notin @('develop', 'master')) { throw 'Unexpected target branch.' }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          $marker = "chore: bump $env:TARGET_BRANCH version after PR #$env:PR_NUMBER [auto-version]"

          for ($attempt = 1; $attempt -le 3; $attempt++) {
            git fetch origin $env:TARGET_BRANCH
            if ($LASTEXITCODE -ne 0) { throw "Failed to fetch $env:TARGET_BRANCH." }

            # A rerun must not increment the version a second time.
            $existing = git log "origin/$env:TARGET_BRANCH" --format=%H --fixed-strings --grep="$marker" -1
            if ($LASTEXITCODE -ne 0) { throw 'Failed to check version-bump history.' }
            if ($existing) {
              "sha=$existing" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
              exit 0
            }

            # Recompute from the latest branch on each retry. This reset only
            # affects the disposable Actions checkout, never a developer's files.
            git reset --hard "origin/$env:TARGET_BRANCH"
            if ($LASTEXITCODE -ne 0) { throw 'Failed to reset the Actions checkout.' }
            $version = & ./.github/scripts/Bump-Version.ps1 -Branch $env:TARGET_BRANCH
            git add -- src/Directory.Build.props
            if ($LASTEXITCODE -ne 0) { throw 'Failed to stage the version bump.' }
            git commit -m "$marker" -m "Version: $version"
            if ($LASTEXITCODE -ne 0) { throw 'Failed to commit the version bump.' }

            git push origin "HEAD:$env:TARGET_BRANCH"
            if ($LASTEXITCODE -eq 0) {
              $sha = git rev-parse HEAD
              if ($LASTEXITCODE -ne 0) { throw 'Failed to read the bump commit SHA.' }
              "sha=$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
              exit 0
            }
            Write-Host "Push failed on attempt $attempt; retrying against the latest $env:TARGET_BRANCH."
          }

          throw 'Could not push the version bump. Check target branch protection and Actions write permissions, then rerun this workflow.'

  build-bumped-version:
    needs: bump-version
    permissions:
      contents: read
    uses: ./.github/workflows/build-github.yml
    with:
      ref: ${{ needs.bump-version.outputs.sha }}
      prerelease: ${{ github.event.pull_request.base.ref == 'develop' }}

  publish-nuget:
    needs: build-bumped-version
    if: >-
      github.event.pull_request.merged == true &&
      (github.base_ref == 'develop' || github.base_ref == 'master')
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: pwsh
    env:
      PATH_ARTIFACTS: ${{ github.workspace }}/artifacts
    steps:
      - name: Check Trusted Publishing configuration
        env:
          NUGET_USER: ${{ vars.NUGET_USER }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NUGET_USER)) {
            throw 'Set the NUGET_USER repository Actions variable to your NuGet.org username (not your email address).'
          }

      - name: Download built packages
        uses: actions/download-artifact@v7
        with:
          name: ${{ needs.build-bumped-version.outputs.artifact-name }}
          path: ${{ env.PATH_ARTIFACTS }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # Keep OIDC login in this top-level workflow so the NuGet policy matches
      # bump-version.yml. The build workflow receives no publishing credentials.
      - name: Authenticate to NuGet.org
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish to NuGet.org
        env:
          NUGET_AUTH_TOKEN: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          if ([string]::IsNullOrWhiteSpace($env:NUGET_AUTH_TOKEN)) {
            throw 'Trusted Publishing did not return an API key. Check the Authenticate to NuGet.org step and the NuGet.org policy for bump-version.yml.'
          }
          # Resolve files in PowerShell: NuGet's wildcard matching fails on
          # Windows paths mixing backslashes with the workflow's forward slashes.
          $packages = @(Get-ChildItem -LiteralPath $env:PATH_ARTIFACTS -Filter '*.nupkg' -File)
          if ($packages.Count -eq 0) {
            throw "No NuGet packages were found in $env:PATH_ARTIFACTS. Check the Pack NuGet step."
          }
          foreach ($package in $packages) {
            Write-Host "Publishing $($package.Name) to NuGet.org"
            $pushOutput = dotnet nuget push $package.FullName --api-key $env:NUGET_AUTH_TOKEN --source https://api.nuget.org/v3/index.json --skip-duplicate --force-english-output 2>&1
            $pushExitCode = $LASTEXITCODE
            $message = ($pushOutput | Out-String).Replace($env:NUGET_AUTH_TOKEN, '***')
            Write-Host $message
            if ($pushExitCode -ne 0) {
              if ($message -match '\b(401|403)\b|Unauthorized|Forbidden') {
                throw "NuGet.org rejected the credentials for $($package.Name). Check the NuGet Trusted Publishing policy owner and Push scope for Lite.EventIpc, then rerun the failed publishing job to request a fresh temporary key."
              }
              throw "NuGet publish failed for $($package.Name) with exit code $pushExitCode. See the NuGet output above for the server error."
            }
          }
